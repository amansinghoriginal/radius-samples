# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
---
name: Synthetic User - Radius Tutorials

on:
  schedule:
    - cron: "0 13 * * 5"
  workflow_dispatch:
    inputs:
      docs_ref:
        description: Radius Docs branch or tag to evaluate
        required: true
        default: synthetic-user-quickstart
        type: string

permissions:
  contents: read

concurrency:
  group: radius-tutorial-evaluation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evaluate:
    name: Evaluate ${{ matrix.tutorial }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - tutorial: quick-start
            docs_path: quick-start
            prerequisite_profile: uninitialized
          - tutorial: add-radius
            docs_path: reference/samples/add-radius
            prerequisite_profile: uninitialized
          - tutorial: local-dev-recipes
            docs_path: guides/recipes/howto-dev-recipes
            prerequisite_profile: uninitialized
          - tutorial: service-networking
            docs_path: guides/author-apps/networking/service-networking
            prerequisite_profile: radius-initialized
          - tutorial: patch-podspec
            docs_path: guides/author-apps/kubernetes/patch-podspec
            prerequisite_profile: radius-initialized
    env:
      DOCS_REF: ${{ inputs.docs_ref || 'synthetic-user-quickstart' }}

    steps:
      - name: Checkout Samples
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout Radius Docs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: amansinghoriginal/radius-docs
          ref: ${{ env.DOCS_REF }}
          path: tutorial-evaluation/docs-source
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tutorial-evaluation/docs-source/docs/go.mod
          cache: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: tutorial-evaluation/docs-source/.node-version

      - name: Build rendered documentation
        working-directory: tutorial-evaluation/docs-source/docs
        env:
          HUGO_ENV: production
        run: |
          npm ci
          npm run build -- --baseURL http://127.0.0.1:1313/
          test -f public/${{ matrix.docs_path }}/index.html

      - name: Run synthetic-user evaluation
        id: evaluation
        continue-on-error: true
        uses: devcontainers/ci@v0.3
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_PAT_TOKEN }}
          RADIUS_TUTORIAL_EVALUATION: "true"
          RADIUS_TUTORIAL_ID: ${{ matrix.tutorial }}
          RADIUS_TUTORIAL_PATH: ${{ matrix.docs_path }}
          RADIUS_PREREQUISITE_PROFILE: ${{ matrix.prerequisite_profile }}
        with:
          configFile: .devcontainer/devcontainer.json
          push: never
          runCmd: |
            set -eu

            export NODE_PATH="$(npm root --global)"
            REPOSITORY_ROOT="$PWD"
            EVALUATION_ROOT="tutorial-evaluation/$RADIUS_TUTORIAL_ID"
            WORKSPACE="$EVALUATION_ROOT/workspace"
            DOCS_ROOT="tutorial-evaluation/docs-source/docs/public"
            COPILOT_OUTPUT="$EVALUATION_ROOT/copilot-output.txt"
            mkdir -p "$WORKSPACE"

            python3 -m http.server 1313 \
              --bind 127.0.0.1 \
              --directory "$DOCS_ROOT" \
              > "$EVALUATION_ROOT/docs-server.log" 2>&1 &
            DOCS_SERVER_PID=$!
            trap 'kill "$DOCS_SERVER_PID" 2>/dev/null || true' EXIT

            ready=false
            for _ in $(seq 1 30); do
              if wget --quiet --spider "http://127.0.0.1:1313/$RADIUS_TUTORIAL_PATH/"; then
                ready=true
                break
              fi
              sleep 1
            done
            if [ "$ready" != "true" ]; then
              echo "Rendered tutorial did not become available." >&2
              exit 1
            fi

            if [ "$RADIUS_PREREQUISITE_PROFILE" = "radius-initialized" ]; then
              "$REPOSITORY_ROOT/.github/scripts/radius-terminal.exp" \
                next 600 "$WORKSPACE" "$EVALUATION_ROOT/prerequisite-init.txt" \
                rad init
            fi

            TUTORIAL_URL="http://127.0.0.1:1313/$RADIUS_TUTORIAL_PATH/"
            PROMPT_CONTEXT=$(printf '%s\n' \
              "Tutorial identifier: $RADIUS_TUTORIAL_ID" \
              "Rendered tutorial URL: $TUTORIAL_URL" \
              "Repository root: $REPOSITORY_ROOT" \
              "Working directory: $REPOSITORY_ROOT/$WORKSPACE" \
              "Prerequisite profile: $RADIUS_PREREQUISITE_PROFILE" \
              "")
            copilot_exit=0
            timeout 2700 copilot \
              -C "$WORKSPACE" \
              --prompt "$PROMPT_CONTEXT$(cat "$REPOSITORY_ROOT/.github/prompts/tutorial-evaluation.md")" \
              --model gpt-5.6-sol \
              --effort xhigh \
              --context long_context \
              --allow-all-tools \
              --allow-all-paths \
              --allow-url localhost \
              --allow-url 127.0.0.1 \
              --deny-tool fetch \
              --deny-tool websearch \
              --deny-tool githubRepo \
              --deny-tool 'shell(curl *)' \
              --deny-tool 'shell(wget *)' \
              --deny-tool 'shell(nc *)' \
              --deny-tool 'shell(ssh *)' \
              --deny-tool 'shell(scp *)' \
              --deny-tool 'shell(telnet *)' \
              --deny-tool 'shell(ftp *)' \
              --deny-tool 'shell(dd *)' \
              --deny-tool 'shell(rm -rf /*)' \
              --disable-builtin-mcps \
              --no-ask-user \
              --no-auto-update \
              --no-custom-instructions \
              --no-remote-export \
              --secret-env-vars COPILOT_GITHUB_TOKEN \
              > "$COPILOT_OUTPUT" 2>&1 || copilot_exit=$?

            cat "$COPILOT_OUTPUT"
            echo "$copilot_exit" > "$EVALUATION_ROOT/copilot-exit-code.txt"

            REPORT=$(find "$WORKSPACE" -maxdepth 2 -type f -name report.md \
              -path '*/evaluation-*/*' | sort -r | head -1)
            if [ -z "$REPORT" ]; then
              echo "No evaluation report was produced." >&2
              exit 1
            fi

            printf '%s\n' "$REPORT" > "$EVALUATION_ROOT/report-path.txt"
            STATUS_COUNT=$(grep -cE '^## STATUS: (SUCCESS|FAILURE)$' "$REPORT" || true)
            FINAL_LINE=$(tail -n 1 "$REPORT")

            if [ "$STATUS_COUNT" -ne 1 ]; then
              echo "The report must contain exactly one status line." >&2
              exit 1
            fi
            if [ "$FINAL_LINE" != "## STATUS: SUCCESS" ]; then
              echo "The evaluation did not succeed: $FINAL_LINE" >&2
              exit 1
            fi

      - name: Publish evaluation report
        if: always()
        run: |
          REPORT=$(find "tutorial-evaluation/${{ matrix.tutorial }}/workspace" \
            -maxdepth 2 -type f -name report.md \
            -path '*/evaluation-*/*' | sort -r | head -1)
          if [ -z "$REPORT" ]; then
            {
              echo "## Radius tutorial evaluation: ${{ matrix.tutorial }}"
              echo ""
              echo "No report was produced."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          sed -i '1s/^\xEF\xBB\xBF//' "$REPORT"
          sed -i 's/\r$//' "$REPORT"

          {
            echo "## Radius tutorial evaluation: ${{ matrix.tutorial }}"
            echo ""
            cat "$REPORT"
          } >> "$GITHUB_STEP_SUMMARY"

          STATUS_COUNT=$(grep -cE '^## STATUS: (SUCCESS|FAILURE)$' "$REPORT" || true)
          FINAL_LINE=$(tail -n 1 "$REPORT")
          if [ "$STATUS_COUNT" -ne 1 ] || [ "$FINAL_LINE" != "## STATUS: SUCCESS" ]; then
            exit 1
          fi

      - name: Upload evaluation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: radius-tutorial-${{ matrix.tutorial }}-${{ github.run_id }}
          path: |
            tutorial-evaluation/${{ matrix.tutorial }}/workspace/evaluation-*/
            tutorial-evaluation/${{ matrix.tutorial }}/copilot-exit-code.txt
            tutorial-evaluation/${{ matrix.tutorial }}/copilot-output.txt
            tutorial-evaluation/${{ matrix.tutorial }}/docs-server.log
            tutorial-evaluation/${{ matrix.tutorial }}/prerequisite-init.txt
            tutorial-evaluation/docs-source/docs/public/${{ matrix.docs_path }}/
            .github/prompts/tutorial-evaluation.md
            .github/scripts/radius-terminal.exp
          if-no-files-found: warn
          retention-days: 14
